<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>COMAX INSIGHT – ELI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: 'Segoe UI', Arial, sans-serif; }

    header {
      background: #2d7a2d;
      color: white;
      height: 56px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header h1 { font-size: 1.1rem; font-weight: 600; }
    header span { font-size: 0.85rem; opacity: 0.8; }

    .container {
      width: 100%;
      height: calc(100vh - 56px);
      position: relative;
    }

    qlik-embed {
      display: block;
      width: 100%;
      height: 100%;
    }

    .welcome-overlay {
      position: absolute;
      inset: 0;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      transition: opacity 0.4s ease;
    }

    .welcome-overlay.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .logo-wrap {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .logo-comax {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-weight: 800;
      font-size: 3.8rem;
      color: #6ab41a;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .logo-insight {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-weight: 300;
      font-size: 3.8rem;
      color: #555;
    }

    .welcome-hint {
      margin-top: 2.5rem;
      font-size: 0.9rem;
      color: #bbb;
      letter-spacing: 0.5px;
    }
  </style>

  <script
    crossorigin="anonymous"
    type="application/javascript"
    src="https://cdn.jsdelivr.net/npm/@qlik/embed-web-components@1/dist/index.min.js"
    data-host="https://qai.eu.qlikcloud.com"
    data-auth-type="Oauth2"
    data-client-id="019e3b177042dc8941b372a92325a982"
    data-redirect-uri="https://eli-wolfson.github.io/comax-qlik-assistant/oauth-callback.html"
    data-access-token-storage="session"
    data-auto-redirect="true"
    data-web-integration-id="Aku8os3C5WNMjXWM4Asl-bvgaiPHlr7o">
  </script>
</head>
<body>
  <header>
    <div>
      <h1>COMAX INSIGHT</h1>
      <span>ELI – מנוע שאלות ותשובות על הדאטה</span>
    </div>
  </header>
  <div class="container">
    <div class="welcome-overlay" id="overlay">
      <div class="logo-wrap">
        <span class="logo-comax">COMAX</span><span class="logo-insight">Insight</span>
      </div>
      <p class="welcome-hint">לחץ להתחלה</p>
    </div>
    <qlik-embed
      ui="ai/agentic-assistant"
      assistant-id="a6ea08b9-e511-408b-8741-16984fd1d5c2"
      appearance="qlik-light">
    </qlik-embed>
  </div>

  <script>
    const overlay = document.getElementById('overlay');
    const container = document.querySelector('.container');

    overlay.addEventListener('click', () => {
      // Step 1: let clicks pass through but keep covering the Qlik logo
      overlay.style.pointerEvents = 'none';
      overlay.querySelector('.welcome-hint').textContent = '';
    });

    // Step 2: fade out only when user actually clicks on the Qlik input beneath
    container.addEventListener('pointerdown', (e) => {
      if (e.target !== overlay && !overlay.contains(e.target)) {
        overlay.classList.add('fade-out');
        setTimeout(() => overlay.remove(), 400);
        container.removeEventListener('pointerdown', arguments.callee);
      }
    });
  </script>
</body>
</html>
