<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>COMAX INSIGHT – ELI Assistant</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f4f6f4;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #2d7a2d;
      color: white;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    header h1 {
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    header span {
      font-size: 0.9rem;
      opacity: 0.8;
    }

    .assistant-container {
      flex: 1;
      display: flex;
    }

    qlik-embed {
      flex: 1;
      height: 100%;
    }
  </style>

  <script
    crossorigin="anonymous"
    type="application/javascript"
    src="https://cdn.jsdelivr.net/npm/@qlik/embed-web-components@1/dist/index.min.js"
    data-host="qai.eu.qlikcloud.com"
    data-client-id="019e3b177042dc8941b372a92325a982"
    data-redirect-uri="https://eli-wolfson.github.io/comax-qlik-assistant/oauth-callback.html"
    data-access-token-storage="session">
  </script>
</head>
<body>

  <header>
    <div>
      <h1>COMAX INSIGHT</h1>
      <span>ELI – מנוע שאלות ותשובות על הדאטה</span>
    </div>
  </header>

  <div class="assistant-container">
    <qlik-embed
      ui="ai/agentic-assistant"
      assistant-id="a6ea08b9-e511-408b-8741-16984fd1d5c2"
      appearance="qlik-light">
    </qlik-embed>
  </div>

</body>
</html>
