<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>COMAX INSIGHT – ELI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: 'Segoe UI', Arial, sans-serif; }

    header {
      background: #2d7a2d;
      color: white;
      height: 56px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header h1 { font-size: 1.1rem; font-weight: 600; }
    header span { font-size: 0.85rem; opacity: 0.8; }

    .container {
      width: 100%;
      height: calc(100vh - 56px);
      position: relative;
    }

    qlik-embed {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Covers only the logo area — bottom 80px stays open for the Qlik input bar */
    .logo-cover {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 80px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      z-index: 5;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .logo-wrap {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .logo-comax {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-weight: 800;
      font-size: 3.8rem;
      color: #6ab41a;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .logo-insight {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-weight: 300;
      font-size: 3.8rem;
      color: #555;
    }

    .logo-hint {
      font-size: 0.85rem;
      color: #bbb;
      letter-spacing: 0.3px;
    }
  </style>

  <script
    crossorigin="anonymous"
    type="application/javascript"
    src="https://cdn.jsdelivr.net/npm/@qlik/embed-web-components@1/dist/index.min.js"
    data-host="https://qai.eu.qlikcloud.com"
    data-auth-type="Oauth2"
    data-client-id="019e3b177042dc8941b372a92325a982"
    data-redirect-uri="https://eli-wolfson.github.io/comax-qlik-assistant/oauth-callback.html"
    data-access-token-storage="session"
    data-auto-redirect="true"
    data-web-integration-id="Aku8os3C5WNMjXWM4Asl-bvgaiPHlr7o">
  </script>
</head>
<body>
  <header>
    <div>
      <h1>COMAX INSIGHT</h1>
      <span>ELI – מנוע שאלות ותשובות על הדאטה</span>
    </div>
  </header>
  <div class="container">
    <div class="logo-cover" id="logoCover">
      <div class="logo-wrap">
        <span class="logo-comax">COMAX</span><span class="logo-insight">Insight</span>
      </div>
      <span class="logo-hint">הקלד שאלה בשדה למטה</span>
    </div>
    <qlik-embed
      ui="ai/agentic-assistant"
      assistant-id="a6ea08b9-e511-408b-8741-16984fd1d5c2"
      appearance="qlik-light">
    </qlik-embed>
  </div>

  <script>
    const cover = document.getElementById('logoCover');
    const IGNORE = new Set(['Tab','Shift','Control','Alt','Meta','CapsLock','Escape','ArrowUp','ArrowDown','ArrowLeft','ArrowRight']);

    window.addEventListener('keydown', function handler(e) {
      if (!IGNORE.has(e.key)) {
        cover.style.opacity = '0';
        setTimeout(() => cover.remove(), 400);
        window.removeEventListener('keydown', handler);
      }
    });
  </script>
</body>
</html>
